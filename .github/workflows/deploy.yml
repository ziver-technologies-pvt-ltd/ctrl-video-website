name: Build and Deploy to Zoho Catalyst

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          GH_OWNER: ziver-technologies-pvt-ltd
          GH_REPO: ctrl-video
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://ctrl-video.ziver.co.in

      - name: Prepare Catalyst AppSail Build Directory
        run: |
          mkdir -p build
          cp -r .next public package.json package-lock.json next.config.ts app-config.json build/
          # Ensure build directory has a copy of app-config.json and the root has absolute build_path
          sed -i "s|\"./build\"|\"$GITHUB_WORKSPACE/build\"|g" app-config.json
          sed -i "s|\"./build\"|\"$GITHUB_WORKSPACE/build\"|g" build/app-config.json
          sed -i "s|\"./build\"|\"$GITHUB_WORKSPACE/build\"|g" catalyst.json

      - name: Install Zoho Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Deploy to Zoho Catalyst AppSail
        env:
          ZCATALYST_NON_INTERACTIVE: "1"
        run: |
          ARGS="--token ${{ secrets.CATALYST_TOKEN }} -ni"
          if [ -n "${{ secrets.CATALYST_PROJECT }}" ]; then
            ARGS="$ARGS --project ${{ secrets.CATALYST_PROJECT }}"
          elif [ -n "${{ vars.CATALYST_PROJECT }}" ]; then
            ARGS="$ARGS --project ${{ vars.CATALYST_PROJECT }}"
          fi

          if [ -n "${{ secrets.CATALYST_ORG }}" ]; then
            ARGS="$ARGS --org ${{ secrets.CATALYST_ORG }}"
          elif [ -n "${{ vars.CATALYST_ORG }}" ]; then
            ARGS="$ARGS --org ${{ vars.CATALYST_ORG }}"
          fi

          echo "Executing: catalyst deploy --only appsail $ARGS"
          catalyst deploy --only appsail $ARGS
